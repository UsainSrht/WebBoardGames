name = "web-board-games"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Static files from public_html (compiled Tailwind CSS is built by [build] below)
[assets]
directory = "./public_html"
binding = "ASSETS"
not_found_handling = "404-page"
# Requests the worker handles itself (SEO rewrites, robots/sitemap, WebSockets, API)
run_worker_first = ["/", "/index.html", "/robots.txt", "/sitemap.xml", "/ws", "/api/*"]

[build]
command = "npm run build:css"

# One Durable Object per room: WebSockets + game state
[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[vars]
ENVIRONMENT = "production"
