<style>
  #pk-root { --pk-card: 3.1rem; }
  @media (min-width: 720px) { #pk-root { --pk-card: 3.6rem; } }
  .pk-felt { background: radial-gradient(ellipse at 50% 45%, #1f7a55 0%, #135a3f 55%, #0c3b2a 100%); box-shadow: inset 0 0 0 5px rgba(255,255,255,.07), inset 0 0 60px rgba(0,0,0,.45), 0 12px 40px rgba(0,0,0,.4); }
  .pk-seat { transition: opacity .25s ease, transform .25s ease; }
  .pk-seat.pk-turn { box-shadow: 0 0 0 2px #34d399, 0 0 22px rgba(52,211,153,.45); }
  .pk-seat.pk-gone { opacity: .45; }
  .pk-seat.pk-win { box-shadow: 0 0 0 2px #fbbf24, 0 0 26px rgba(251,191,36,.6); }
  .pk-ring { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); pointer-events: none; }
  .pk-card { width: var(--pk-card); flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .pk-card svg, svg.pk-card { width: 100%; height: auto; display: block; }
  .pk-mini { width: 1.7rem; }
  .pk-hole .pk-card { width: calc(var(--pk-card) * 1.25); }
  .pk-dim { opacity: .38; filter: grayscale(.4); }
  .pk-hit { transform: translateY(-6px); filter: drop-shadow(0 0 7px rgba(251,191,36,.95)); }
  .pk-flip { animation: pk-flip .6s cubic-bezier(.2,.8,.3,1) both; }
  .pk-deal { animation: pk-deal .45s cubic-bezier(.2,.8,.3,1) both; }
  .pk-pop { animation: pk-pop .35s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes pk-flip { 0% { transform: rotateY(90deg) scale(.8); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotateY(0) scale(1); } }
  @keyframes pk-deal { 0% { transform: translateY(-70px) rotate(-14deg) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes pk-pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .pk-fly { position: fixed; z-index: 60; pointer-events: none; margin: 0; }
  .pk-board { perspective: 700px; }
  .reduce-motion .pk-flip, .reduce-motion .pk-deal, .reduce-motion .pk-pop { animation: none; }
  #pk-raise-range { accent-color: #8b5cf6; }
</style>
<div id="pk-root" class="absolute inset-0 flex flex-col gap-1.5 pt-16 pb-[max(env(safe-area-inset-bottom),0.5rem)]">
  <!-- Info bar -->
  <div class="flex shrink-0 flex-wrap items-center justify-between gap-x-3 gap-y-1 px-3 text-xs text-slate-300">
    <p id="pk-blinds" class="font-semibold text-white"></p>
    <p id="pk-level" class="text-slate-400" aria-live="polite"></p>
    <button id="pk-log-btn" class="btn btn-secondary min-h-9 px-3 py-1 text-xs" aria-label="Action log" data-i18n-attr="aria-label:poker.log.title"><i data-icon="chat" class="size-4"></i><span class="hidden sm:inline" data-i18n="poker.log.title">Action log</span></button>
  </div>

  <!-- Table -->
  <div class="relative flex min-h-0 flex-1 flex-col px-2 sm:px-6">
    <ul id="pk-opp" class="mb-1.5 grid shrink-0 grid-cols-4 gap-1.5 sm:hidden"></ul>
    <div id="pk-felt" class="pk-felt relative mx-auto min-h-0 w-full max-w-5xl flex-1 rounded-[2rem] sm:rounded-[50%]">
      <ul id="pk-oval" class="absolute inset-0 hidden sm:block"></ul>
      <div id="pk-center" class="absolute top-1/2 left-1/2 flex w-[94%] -translate-x-1/2 -translate-y-1/2 flex-col items-center gap-1.5 sm:w-[56%]">
        <div id="pk-pot" class="flex min-h-9 items-center gap-2 text-white" aria-live="polite"></div>
        <div id="pk-pots" class="flex flex-wrap justify-center gap-1.5 text-[11px]"></div>
        <div id="pk-board" class="pk-board flex items-center justify-center gap-1 sm:gap-1.5"></div>
        <p id="pk-banner" class="min-h-5 max-w-full text-center text-xs font-semibold text-amber-200 sm:text-sm" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <!-- My seat -->
  <div id="pk-dock" class="shrink-0 px-2 sm:px-6">
    <div class="mx-auto w-full max-w-3xl">
      <div class="mb-1.5 flex items-end justify-center gap-4">
        <div id="pk-hole" class="pk-hole flex items-end gap-1.5"></div>
        <div class="min-w-0 pb-1">
          <div id="pk-me" class="flex items-center gap-2 text-sm"></div>
          <p id="pk-myhand" class="mt-0.5 text-xs font-semibold text-emerald-300" aria-live="polite"></p>
          <p id="pk-status" class="text-xs text-slate-400"></p>
        </div>
      </div>
      <div id="pk-actions" class="space-y-1.5" hidden>
        <div id="pk-raise" class="card-flat space-y-1.5 p-2" hidden>
          <div class="flex items-center gap-2">
            <input id="pk-raise-range" type="range" class="h-8 min-w-0 flex-1" min="0" max="100" step="1" aria-label="Raise to" data-i18n-attr="aria-label:poker.act.raiseToLabel">
            <input id="pk-raise-input" type="number" inputmode="numeric" class="input w-24 text-center text-base" aria-label="Raise to" data-i18n-attr="aria-label:poker.act.raiseToLabel">
          </div>
          <div id="pk-presets" class="grid grid-cols-5 gap-1">
            <button data-p="min" class="btn btn-secondary min-h-11 px-1 text-xs" data-i18n="poker.preset.min">Min</button>
            <button data-p="0.5" class="btn btn-secondary min-h-11 px-1 text-xs" data-i18n="poker.preset.half">1/2 pot</button>
            <button data-p="0.75" class="btn btn-secondary min-h-11 px-1 text-xs" data-i18n="poker.preset.threeq">3/4 pot</button>
            <button data-p="1" class="btn btn-secondary min-h-11 px-1 text-xs" data-i18n="poker.preset.pot">Pot</button>
            <button data-p="max" class="btn btn-secondary min-h-11 px-1 text-xs" data-i18n="poker.preset.allin">All-in</button>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button id="pk-fold" class="btn min-h-14 bg-rose-600 text-base font-bold text-white hover:bg-rose-500" data-i18n="poker.act.fold">Fold</button>
          <button id="pk-call" class="btn btn-secondary min-h-14 text-base font-bold"></button>
          <button id="pk-raise-btn" class="btn btn-primary min-h-14 text-base font-bold"></button>
        </div>
      </div>
      <div id="pk-away" class="flex justify-center" hidden>
        <button id="pk-back" class="btn btn-primary min-h-12" data-i18n="poker.act.back">I am back</button>
      </div>
    </div>
  </div>

  <!-- Log -->
  <div id="pk-log-modal" class="fixed inset-0 z-40 grid place-items-center bg-black/60 p-4 backdrop-blur-sm" hidden>
    <div class="card w-full max-w-md p-4">
      <div class="mb-2 flex items-center justify-between">
        <h2 class="font-bold text-white" data-i18n="poker.log.title">Action log</h2>
        <button id="pk-log-close" class="btn btn-secondary min-h-10 px-3" aria-label="Close" data-i18n-attr="aria-label:poker.close"><i data-icon="x" class="size-4"></i></button>
      </div>
      <ol id="pk-log" class="scroll-y max-h-[60vh] space-y-1 text-sm text-slate-200"></ol>
    </div>
  </div>
</div>
