<style>
  #ty-root { --line: 2.5rem; }
  #ty-box { height: calc(var(--line) * 3); font-size: 1.45rem; line-height: var(--line); }
  @media (min-width: 640px) { #ty-root { --line: 2.9rem; } #ty-box { font-size: 1.7rem; } }
  #ty-inner { position: relative; transition: transform 0.18s ease-out; will-change: transform; }
  #ty-inner .w { display: inline-block; white-space: nowrap; }
  #ty-inner .w.bad { text-decoration: underline wavy rgb(244 63 94 / 0.8); text-underline-offset: 6px; text-decoration-thickness: 1.5px; }
  #ty-inner .l { color: #5b6485; }
  #ty-inner .l.ok { color: #e8ecfa; }
  #ty-inner .l.no { color: #fb7185; }
  #ty-inner .l.ex { color: #be123c; }
  #ty-caret { position: absolute; top: 0; left: 0; width: 2px; height: calc(var(--line) * 0.78); margin-top: calc(var(--line) * 0.11); border-radius: 1px; background: #a5b4fc; transition: transform 0.09s linear; animation: ty-blink 1s steps(1) infinite; }
  #ty-caret.typing { animation: none; }
  @keyframes ty-blink { 50% { opacity: 0; } }
  .ty-go { animation: ty-count 0.9s ease-out both; }
  @keyframes ty-count { from { transform: scale(1.5); opacity: 0; } 25% { opacity: 1; } to { transform: scale(0.9); opacity: 0.9; } }
  .ty-lane-fill { transition: width 0.25s linear; }
  @media (prefers-reduced-motion: reduce) { #ty-inner, #ty-caret, .ty-lane-fill { transition: none; } #ty-caret, .ty-go { animation: none; } }
  .reduce-motion #ty-inner, .reduce-motion #ty-caret, .reduce-motion .ty-lane-fill { transition: none; }
  .reduce-motion #ty-caret, .reduce-motion .ty-go { animation: none; }
</style>
<div id="ty-root" class="absolute inset-0 flex flex-col items-center overflow-y-auto pt-16 pb-[max(env(safe-area-inset-bottom),1rem)]">
  <div class="flex w-full max-w-3xl flex-1 flex-col justify-start gap-3 pb-10 sm:justify-center px-3 sm:gap-4 sm:px-5">

    <!-- live numbers -->
    <div class="flex items-end justify-between gap-3">
      <div class="flex items-baseline gap-5">
        <div><p id="ty-time" class="text-4xl leading-none font-black text-white tabular-nums sm:text-5xl">0</p><p class="mt-1 text-[11px] font-semibold tracking-wide text-slate-400 uppercase" data-i18n="typing.time">Seconds</p></div>
        <div><p id="ty-wpm" class="text-2xl leading-none font-extrabold text-brand-300 tabular-nums sm:text-3xl">0</p><p class="mt-1 text-[11px] font-semibold tracking-wide text-slate-400 uppercase" data-i18n="typing.wpm">WPM</p></div>
        <div><p id="ty-acc" class="text-2xl leading-none font-extrabold text-slate-200 tabular-nums sm:text-3xl">100%</p><p class="mt-1 text-[11px] font-semibold tracking-wide text-slate-400 uppercase" data-i18n="typing.acc">Accuracy</p></div>
      </div>
      <span id="ty-meta" class="chip"></span>
    </div>

    <!-- race lanes -->
    <ul id="ty-lanes" class="space-y-1.5" aria-label="Race" data-i18n-attr="aria-label:typing.lanes"></ul>

    <!-- text -->
    <div id="ty-stage" class="relative">
      <div id="ty-box" class="card-flat relative overflow-hidden rounded-2xl px-4 py-0 select-none sm:px-6">
        <div id="ty-inner" lang="en"><div id="ty-caret" aria-hidden="true"></div><div id="ty-words"></div></div>
      </div>
      <input id="ty-input" type="text" class="absolute inset-0 z-10 size-full cursor-text opacity-0" style="font-size: 16px" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" inputmode="text" data-i18n-attr="aria-label:typing.input" aria-label="Type here" />
      <div id="ty-focus" class="pointer-events-none absolute inset-0 z-20 grid place-items-center rounded-2xl bg-ink-950/70 text-center text-sm font-semibold text-slate-200 backdrop-blur-[2px]" hidden>
        <span class="inline-flex items-center gap-2"><i data-icon="keyboard" class="size-5"></i><span id="ty-focus-text" data-i18n="typing.tapToType">Tap here and start typing</span></span>
      </div>
      <div id="ty-count" class="pointer-events-none absolute inset-0 z-30 grid place-items-center rounded-2xl bg-ink-950/60 backdrop-blur-[2px]" hidden>
        <span id="ty-count-n" class="text-7xl font-black text-white"></span>
      </div>
    </div>

    <p id="ty-hint" class="text-center text-sm text-slate-400" aria-live="polite"></p>
  </div>

  <!-- results -->
  <div id="ty-results" class="fixed inset-0 z-30 grid place-items-center overflow-y-auto bg-ink-950/80 p-4 backdrop-blur-sm" hidden>
    <div class="card animate-pop my-auto w-full max-w-lg p-5">
      <p id="ty-res-eyebrow" class="eyebrow text-center"></p>
      <div id="ty-res-me">
        <div class="mt-2 flex items-end justify-center gap-6 text-center">
          <div><p id="ty-r-wpm" class="text-6xl leading-none font-black text-white tabular-nums"></p><p class="mt-1 text-xs font-semibold tracking-wide text-slate-400 uppercase" data-i18n="typing.wpm">WPM</p></div>
          <div><p id="ty-r-acc" class="text-3xl leading-none font-extrabold text-brand-300 tabular-nums"></p><p class="mt-1 text-xs font-semibold tracking-wide text-slate-400 uppercase" data-i18n="typing.acc">Accuracy</p></div>
        </div>
        <p id="ty-r-pb" class="mt-3 text-center text-sm font-semibold"></p>
        <div id="ty-chart" class="mt-4 rounded-xl bg-white/4 p-2"></div>
        <dl class="mt-3 grid grid-cols-4 gap-2 text-center">
          <div class="rounded-xl bg-white/5 px-1 py-2"><dd id="ty-r-raw" class="text-lg font-bold text-white tabular-nums"></dd><dt class="text-[11px] text-slate-400" data-i18n="typing.raw">Raw</dt></div>
          <div class="rounded-xl bg-white/5 px-1 py-2"><dd id="ty-r-con" class="text-lg font-bold text-white tabular-nums"></dd><dt class="text-[11px] text-slate-400" data-i18n="typing.consistency">Consistency</dt></div>
          <div class="rounded-xl bg-white/5 px-1 py-2"><dd id="ty-r-chars" class="text-lg font-bold text-white tabular-nums"></dd><dt class="text-[11px] text-slate-400" data-i18n="typing.chars">Correct</dt></div>
          <div class="rounded-xl bg-white/5 px-1 py-2"><dd id="ty-r-err" class="text-lg font-bold text-white tabular-nums"></dd><dt class="text-[11px] text-slate-400" data-i18n="typing.errors">Mistakes</dt></div>
        </dl>
      </div>
      <ul id="ty-res-rows" class="mt-4 space-y-1.5"></ul>
      <p class="mt-4 text-center text-sm text-slate-400" data-i18n="typing.standingsNext">The standings follow in a moment.</p>
    </div>
  </div>
</div>
