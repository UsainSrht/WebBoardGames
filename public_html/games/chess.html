<div id="chess-root" class="absolute inset-0 flex flex-col items-center justify-center px-2 pt-16 text-white">
    <div id="chess-opponent" class="mb-2 font-semibold text-lg"></div>
    <div id="chess-board" class="grid grid-cols-8 border-4 border-amber-900 rounded-md overflow-hidden select-none" style="width:min(90vw,70vh);aspect-ratio:1/1"></div>
    <div id="chess-me" class="mt-2 font-semibold text-lg"></div>
    <p id="chess-status" class="mt-2 text-indigo-300 h-6"></p>
    <button id="chess-resign" class="mt-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-red-600 text-sm transition-all">Resign</button>
    <div id="chess-promo" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="glass-card rounded-2xl p-6 flex gap-4 text-5xl" id="chess-promo-options"></div>
    </div>
</div>
