<style>
  #uno-root { --cw: 4.4rem; --ch: 6.5rem; }
  @media (min-width: 640px) { #uno-root { --cw: 5.4rem; --ch: 8rem; } }
  @media (min-width: 1024px) and (min-height: 760px) { #uno-root { --cw: 6rem; --ch: 9rem; } }
  .uno-fly { position: fixed; z-index: 60; pointer-events: none; margin: 0; }
  .uno-new { animation: slide-up 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .uno-bump { animation: pop 0.3s cubic-bezier(0.2, 1.2, 0.4, 1) both; }
  .uno-glow { transition: box-shadow 0.35s ease, background 0.35s ease; }
</style>
<div id="uno-root" class="absolute inset-0 flex flex-col justify-between gap-1.5 pt-16 pb-[max(env(safe-area-inset-bottom),0.75rem)]">
  <!-- Players -->
  <div class="scroll-y shrink-0 px-3">
    <ul id="uno-players" class="mx-auto flex w-max gap-2"></ul>
  </div>

  <!-- Table -->
  <div class="relative flex min-h-0 flex-1 flex-col items-center justify-center gap-2.5 px-3">
    <p id="uno-round" class="text-xs font-semibold tracking-wide text-slate-400 uppercase" hidden></p>
    <div class="flex items-center gap-6 sm:gap-10">
      <button id="uno-deck" class="relative grid place-items-center rounded-xl border-[3px] border-white bg-ink-900 text-center shadow-xl transition hover:-translate-y-1 active:scale-95 disabled:opacity-60 disabled:hover:translate-y-0" style="width: calc(var(--cw) * 1.15); height: calc(var(--ch) * 1.15)" aria-label="Draw a card">
        <span class="-rotate-12 text-xl font-black tracking-tight text-rose-500 italic">UNO</span>
        <span id="uno-deck-count" class="absolute bottom-1.5 text-[10px] font-semibold text-slate-400"></span>
        <span id="uno-deck-badge" class="uno-bump absolute -top-2.5 -right-2.5 grid min-w-8 place-items-center rounded-full bg-rose-500 px-2 py-1 text-sm font-extrabold text-white shadow-lg" hidden></span>
      </button>
      <div class="relative" style="width: calc(var(--cw) * 1.15); height: calc(var(--ch) * 1.15)">
        <div id="uno-glow" class="uno-glow absolute -inset-3 rounded-[1.6rem]"></div>
        <div id="uno-pile" class="absolute inset-0"></div>
        <span id="uno-dir" class="absolute -right-4 -bottom-4 grid size-10 place-items-center rounded-full border-[3px] border-white bg-ink-900 text-white shadow-lg" title="Direction of play"></span>
      </div>
    </div>

    <p id="uno-log" class="min-h-10 max-w-md text-center text-sm font-medium text-slate-200" aria-live="polite"></p>

    <div class="w-56 max-w-full">
      <div class="h-1.5 overflow-hidden rounded-full bg-white/10"><div id="uno-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-brand-500 to-violet-500"></div></div>
      <p id="uno-timer" class="mt-1 h-4 text-center text-xs text-slate-400"></p>
    </div>

    <div class="flex min-h-12 items-center gap-2">
      <button id="uno-pass" class="btn btn-secondary" hidden><i data-icon="arrow-right" class="size-4"></i>Keep card and pass</button>
      <button id="uno-callbtn" class="btn btn-lg animate-pulse-soft bg-rose-600 text-white shadow-lg shadow-rose-600/40 hover:bg-rose-500" hidden>UNO!</button>
      <button id="uno-catchbtn" class="btn btn-lg bg-amber-500 text-ink-900 hover:bg-amber-400" hidden><i data-icon="bolt" class="size-5"></i><span>Catch</span></button>
    </div>
  </div>

  <!-- Hand -->
  <div class="shrink-0">
    <p id="uno-hand-label" class="mb-1 px-4 text-xs font-semibold tracking-wide text-slate-400 uppercase"></p>
    <div class="scroll-y px-3 pt-4 pb-1" style="overflow-y: hidden">
      <div id="uno-hand" class="mx-auto flex w-max items-end gap-2"></div>
    </div>
  </div>

  <!-- Colour picker -->
  <div id="uno-colors" class="fixed inset-0 z-40 grid place-items-center bg-black/60 backdrop-blur-sm" hidden>
    <div class="card p-6 text-center">
      <p class="mb-4 font-semibold text-white">Choose a colour</p>
      <div id="uno-color-options" class="grid grid-cols-2 gap-3"></div>
    </div>
  </div>

  <!-- Round summary -->
  <div id="uno-summary" class="fixed inset-0 z-30 grid place-items-center overflow-y-auto bg-ink-950/70 p-4 backdrop-blur-sm" hidden>
    <div class="card animate-pop w-full max-w-sm p-5">
      <p class="eyebrow text-center">Round over</p>
      <h2 id="uno-summary-title" class="mt-1 mb-4 text-center text-xl font-bold text-white"></h2>
      <ul id="uno-summary-rows" class="space-y-1.5"></ul>
      <p id="uno-summary-next" class="mt-4 text-center text-sm text-slate-400"></p>
    </div>
  </div>
</div>
