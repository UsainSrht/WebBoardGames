<div id="uno-root" class="absolute inset-0 flex flex-col items-center justify-between px-3 pt-16 pb-4 text-white">
    <div id="uno-players" class="flex flex-wrap justify-center gap-2"></div>
    <div class="flex flex-col items-center gap-3">
        <div class="flex items-center gap-6">
            <button id="uno-deck" class="w-20 h-28 rounded-xl bg-gray-900 border-4 border-white flex flex-col items-center justify-center font-black text-red-500 hover:scale-105 transition-transform disabled:opacity-60">
                UNO<span id="uno-deck-count" class="text-xs text-gray-300 font-normal"></span>
            </button>
            <div id="uno-top" class="w-24 h-32 rounded-xl border-4 border-white flex items-center justify-center text-4xl font-black"></div>
        </div>
        <p id="uno-color" class="text-sm text-gray-300"></p>
        <p id="uno-log" class="text-indigo-300 h-6 text-center"></p>
        <p id="uno-timer" class="text-sm text-gray-400 h-4"></p>
        <button id="uno-pass" class="hidden px-6 py-2 rounded-xl bg-white/10 hover:bg-white/20">Keep card &amp; pass</button>
    </div>
    <div id="uno-hand" class="flex flex-wrap justify-center gap-2 max-w-4xl"></div>
    <div id="uno-colors" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="glass-card rounded-2xl p-6 text-center">
            <p class="mb-4 font-semibold">Choose a colour</p>
            <div class="grid grid-cols-2 gap-3" id="uno-color-options"></div>
        </div>
    </div>
</div>
