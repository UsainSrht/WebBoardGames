<div id="dice-root" class="absolute inset-0 flex flex-col items-center justify-start pt-20 px-4 text-white overflow-y-auto">
    <h1 class="text-3xl font-bold mb-1">🎲 Dice</h1>
    <p id="dice-round" class="text-gray-300 mb-1">Waiting for players…</p>
    <p id="dice-timer" class="text-indigo-300 mb-4 h-6"></p>
    <button id="dice-roll-btn" class="px-10 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 font-semibold text-xl mb-6 disabled:opacity-40 disabled:cursor-not-allowed" disabled>Roll the dice</button>
    <div id="dice-players" class="w-full max-w-xl space-y-2"></div>
    <p id="dice-footer" class="mt-6 text-xl font-semibold text-emerald-300"></p>
</div>
