<div id="dice-root" class="scroll-y absolute inset-0 flex flex-col items-center px-3 pt-16 pb-[max(env(safe-area-inset-bottom),1rem)] sm:px-6">
  <div class="flex w-full max-w-2xl flex-col gap-3 sm:gap-4">
    <!-- Whose turn -->
    <header class="flex items-center gap-3 px-1 pt-2">
      <div id="fk-avatar" class="shrink-0"></div>
      <div class="min-w-0 flex-1">
        <p id="fk-eyebrow" class="eyebrow" data-i18n="dice.eyebrow">Farkle</p>
        <h2 id="fk-title" class="truncate text-xl font-bold tracking-tight text-white sm:text-2xl" data-i18n="dice.ready">Getting ready</h2>
      </div>
      <div class="shrink-0 text-right">
        <p class="text-[11px] font-semibold tracking-[0.14em] text-slate-400 uppercase" data-i18n="dice.target">Target</p>
        <p id="fk-target" class="text-lg font-bold text-white tabular-nums"></p>
      </div>
    </header>

    <!-- Last round banner -->
    <div id="fk-final" class="flex items-center gap-2.5 rounded-2xl border border-amber-400/40 bg-amber-500/12 px-3.5 py-2.5 text-sm font-medium text-amber-200" hidden role="status"></div>

    <!-- Table -->
    <section class="card relative overflow-hidden p-3 sm:p-5" data-i18n-attr="aria-label:dice.table" aria-label="Dice table">
      <div class="mb-2 flex items-end justify-between gap-3 px-1">
        <div>
          <p class="text-[11px] font-semibold tracking-[0.14em] text-slate-400 uppercase" data-i18n="dice.turnScore">Turn score</p>
          <p class="flex items-baseline gap-2"><span id="fk-turnscore" class="text-3xl font-extrabold text-white tabular-nums sm:text-4xl">0</span><span id="fk-preview" class="text-lg font-bold tabular-nums"></span></p>
        </div>
        <div class="w-28 text-right sm:w-40">
          <p id="fk-timer" class="mb-1 h-4 text-xs font-semibold text-slate-400 tabular-nums"></p>
          <div class="h-1.5 overflow-hidden rounded-full bg-white/10"><div id="fk-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-brand-500 to-violet-500"></div></div>
        </div>
      </div>

      <!-- Set aside -->
      <div class="mb-2 flex min-h-[3.4rem] items-center gap-2 rounded-2xl bg-black/20 px-3 py-2">
        <span class="w-14 shrink-0 text-[10px] leading-tight font-semibold tracking-[0.12em] text-slate-400 uppercase" data-i18n="dice.setAside">Set aside</span>
        <div id="fk-tray" class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5"></div>
      </div>

      <!-- Felt -->
      <div id="fk-felt" class="relative grid min-h-[13.5rem] place-items-center rounded-2xl border border-white/8 bg-gradient-to-b from-emerald-900/40 to-emerald-950/60 px-2 py-4 sm:min-h-[15rem]">
        <div id="fk-dice" class="flex flex-wrap items-center justify-center gap-3 sm:gap-4"></div>
        <div id="fk-banner" class="pointer-events-none absolute inset-0 grid place-items-center"></div>
      </div>

      <p id="fk-hint" class="mt-2.5 min-h-[2.5rem] px-1 text-center text-sm text-slate-300" aria-live="polite"></p>

      <div id="fk-actions" class="mt-1 grid grid-cols-2 gap-2.5">
        <button id="fk-roll" class="btn btn-primary min-h-14 text-base" type="button" disabled></button>
        <button id="fk-bank" class="btn btn-secondary min-h-14 text-base" type="button" disabled></button>
      </div>
      <div class="mt-2 flex justify-center">
        <button id="fk-best" class="btn btn-secondary min-h-11 px-4 text-sm" type="button" data-i18n="dice.best" hidden>Pick best dice</button>
      </div>
    </section>

    <!-- Scoreboard -->
    <aside class="card-flat p-3" data-i18n-attr="aria-label:dice.scoreboard" aria-label="Scoreboard">
      <p class="mb-2 flex items-center gap-2 px-1 text-xs font-semibold tracking-[0.14em] text-slate-400 uppercase"><i data-icon="trophy" class="size-4 text-amber-300"></i><span data-i18n="dice.scoreboard">Scoreboard</span></p>
      <ul id="fk-board" class="space-y-1.5"></ul>
    </aside>
  </div>
</div>
