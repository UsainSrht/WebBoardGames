<style>
  #okey-root { --gap: 3px; }
  .otile { position: relative; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; touch-action: none; cursor: grab; transition: transform 0.14s ease, filter 0.14s ease; filter: drop-shadow(0 2px 1.5px rgb(0 0 0 / 0.45)); }
  .otile svg { display: block; width: 100%; height: 100%; }
  .otile.sel { transform: translateY(-9px); filter: drop-shadow(0 6px 4px rgb(0 0 0 / 0.5)); }
  .otile.sel::after { content: ""; position: absolute; inset: -2px; border-radius: 9px; box-shadow: 0 0 0 2.5px #818cf8; pointer-events: none; }
  .otile.grp { outline: 2px solid #34d399; outline-offset: 1px; border-radius: 7px; }
  .otile.prs { outline: 2px dashed #38bdf8; outline-offset: 1px; border-radius: 7px; }
  .otile.fin::after { content: ""; position: absolute; inset: -2px; border-radius: 9px; box-shadow: 0 0 0 2.5px #fbbf24; pointer-events: none; }
  .otile.fresh { animation: okey-fresh 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) both; }
  .otile.ro { cursor: default; touch-action: auto; }
  .otile.lift { animation: okey-lift 0.35s cubic-bezier(0.2, 1, 0.3, 1) both; }
  @keyframes okey-fresh { 0% { transform: translateY(-34px) scale(1.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes okey-lift { 0% { transform: translateY(-26px) scale(1.15); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .okey-slot { aspect-ratio: 5 / 7; border-radius: 7px; background: rgb(0 0 0 / 0.22); box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.5); }
  .okey-slot.over { background: rgb(129 140 248 / 0.45); }
  .okey-ghost { position: fixed; z-index: 80; pointer-events: none; margin: 0; transform: translate(-50%, -55%) scale(1.15) rotate(-4deg); filter: drop-shadow(0 12px 10px rgb(0 0 0 / 0.55)); }
  .okey-pile.over, .okey-meld.over { outline: 2px solid #818cf8; outline-offset: 1px; }
  .okey-take { animation: okey-glow 1.4s ease-in-out infinite; }
  @keyframes okey-glow { 0%, 100% { box-shadow: 0 0 0 2px rgb(52 211 153 / 0.9), 0 0 0 0 rgb(52 211 153 / 0.5); } 50% { box-shadow: 0 0 0 2px rgb(52 211 153 / 0.9), 0 0 14px 3px rgb(52 211 153 / 0.5); } }
  .okey-wood { background: linear-gradient(180deg, #3b2a4f 0%, #2a1f3d 100%); border: 1px solid rgb(255 255 255 / 0.1); box-shadow: 0 -6px 18px rgb(0 0 0 / 0.35); }
  @media (prefers-reduced-motion: reduce) { .otile, .otile.fresh, .otile.lift, .okey-take { animation: none; transition: none; } }
  .reduce-motion .otile.fresh, .reduce-motion .otile.lift, .reduce-motion .okey-take { animation: none; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="okey-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#ece3c8"/>
    </linearGradient>
    <pattern id="okey-back" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#312e81"/>
      <path d="M0 4h8M4 0v8" stroke="#4f46e5" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
<div id="okey-root" class="absolute inset-0 flex flex-col gap-1.5 pt-16 pb-[max(env(safe-area-inset-bottom),0.5rem)]">
  <!-- Players and their discard piles -->
  <ul id="okey-players" class="mx-auto flex w-full max-w-3xl shrink-0 gap-1.5 px-2"></ul>

  <!-- Middle: indicator, okey, stock and the table -->
  <div class="scroll-y mx-auto flex min-h-0 w-full max-w-3xl flex-1 flex-col gap-2 px-2">
    <div class="flex items-center justify-center gap-4">
      <div class="text-center">
        <div id="okey-indicator" class="mx-auto h-[3.9rem] w-[2.8rem]"></div>
        <p class="mt-1 text-[11px] font-semibold text-slate-400" data-i18n="okey.label.indicator">Indicator</p>
      </div>
      <div class="text-center">
        <div id="okey-okey" class="mx-auto h-[3.9rem] w-[2.8rem]"></div>
        <p class="mt-1 text-[11px] font-semibold text-amber-300" data-i18n="okey.label.okey">Okey</p>
      </div>
      <div class="text-center">
        <button id="okey-stock" class="relative mx-auto block h-[3.9rem] w-[2.8rem] rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-400 disabled:opacity-80" style="touch-action:none" data-i18n-attr="aria-label:okey.aria.stock" aria-label="Stock">
          <span id="okey-stock-art" class="block size-full"></span>
          <span id="okey-stock-count" class="absolute inset-0 grid place-items-center text-base font-extrabold text-white tabular-nums drop-shadow"></span>
        </button>
        <p class="mt-1 text-[11px] font-semibold text-slate-400" data-i18n="okey.label.stock">Stock</p>
      </div>
      <div class="min-w-0 max-w-40 text-xs text-slate-400">
        <p id="okey-round" class="font-semibold text-slate-200"></p>
        <p id="okey-mode" class="mt-0.5"></p>
      </div>
    </div>

    <div class="mx-auto w-full max-w-sm">
      <div class="h-1.5 overflow-hidden rounded-full bg-white/10"><div id="okey-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-brand-500 to-violet-500"></div></div>
      <p id="okey-status" class="mt-1.5 min-h-10 text-center text-sm font-medium text-slate-200" aria-live="polite"></p>
    </div>

    <section id="okey-table-wrap" class="min-h-16 rounded-2xl border border-white/8 bg-white/4 p-2" hidden>
      <p class="mb-1.5 text-xs font-semibold text-slate-400" data-i18n="okey.table.title">Table</p>
      <div id="okey-table" class="flex flex-wrap gap-2"></div>
      <p id="okey-table-empty" class="py-2 text-center text-xs text-slate-500" data-i18n="okey.table.empty">No groups on the table yet</p>
    </section>
  </div>

  <!-- Actions -->
  <div class="mx-auto flex w-full max-w-3xl shrink-0 flex-col gap-1.5 px-2">
    <div id="okey-primary" class="flex min-h-11 flex-wrap items-center justify-center gap-2">
      <span id="okey-total" class="chip chip-brand" hidden></span>
      <button id="okey-discard" class="btn btn-primary" hidden><span data-i18n="okey.btn.discard">Discard</span></button>
      <button id="okey-finish" class="btn btn-primary animate-pulse-soft" hidden><i data-icon="check" class="size-5"></i><span data-i18n="okey.btn.finish">Finish</span></button>
      <button id="okey-open" class="btn btn-primary" hidden><i data-icon="plus" class="size-5"></i><span id="okey-open-label"></span></button>
      <span id="okey-addhint" class="text-xs text-emerald-300" hidden data-i18n="okey.hint.add">Tap a group on the table to add the selected tiles</span>
    </div>
    <div class="grid grid-cols-3 gap-1.5 sm:mx-auto sm:max-w-md">
      <button id="okey-sort-colour" class="btn btn-secondary btn-sm min-w-0 gap-1 px-1.5"><i data-icon="sort" class="size-4"></i><span class="truncate" data-i18n="okey.btn.sortColour">By colour</span></button>
      <button id="okey-sort-number" class="btn btn-secondary btn-sm min-w-0 gap-1 px-1.5"><i data-icon="sort" class="size-4"></i><span class="truncate" data-i18n="okey.btn.sortNumber">By number</span></button>
      <button id="okey-group" class="btn btn-secondary btn-sm min-w-0 gap-1 px-1.5"><i data-icon="sparkles" class="size-4"></i><span class="truncate" data-i18n="okey.btn.group">Auto-group</span></button>
    </div>
  </div>

  <!-- Rack -->
  <div class="okey-wood mx-auto w-full max-w-3xl shrink-0 rounded-2xl p-1.5 pt-3">
    <p id="okey-spectator" class="px-2 pb-2 text-center text-xs text-slate-400" hidden data-i18n="okey.spectator">Host view: racks are private</p>
    <div id="okey-rack" class="grid gap-[3px]" style="grid-template-columns: repeat(12, minmax(0, 1fr))" role="group" data-i18n-attr="aria-label:okey.aria.rack" aria-label="Your rack"></div>
  </div>

  <!-- Pile viewer -->
  <div id="okey-pile-view" class="fixed inset-0 z-40 grid place-items-center bg-black/60 p-4 backdrop-blur-sm" hidden>
    <div class="card w-full max-w-sm p-4">
      <div class="mb-3 flex items-center justify-between gap-2">
        <h2 id="okey-pile-title" class="min-w-0 truncate font-semibold text-white"></h2>
        <button id="okey-pile-close" class="btn btn-secondary btn-icon btn-sm" data-i18n-attr="aria-label:okey.btn.close" aria-label="Close"><i data-icon="x" class="size-4"></i></button>
      </div>
      <div id="okey-pile-tiles" class="flex flex-wrap gap-1.5"></div>
    </div>
  </div>

  <!-- Hand result -->
  <div id="okey-result" class="fixed inset-0 z-30 grid place-items-center overflow-y-auto bg-ink-950/75 p-3 backdrop-blur-sm" hidden>
    <div class="card animate-pop my-auto w-full max-w-md p-4">
      <p class="eyebrow text-center" id="okey-result-eyebrow"></p>
      <h2 id="okey-result-title" class="mt-1 mb-3 text-center text-lg font-bold text-white"></h2>
      <ul id="okey-result-rows" class="space-y-2"></ul>
      <p id="okey-result-next" class="mt-3 text-center text-sm text-slate-400"></p>
    </div>
  </div>
</div>
