<div id="rps-root" class="absolute inset-0 flex flex-col items-center justify-center gap-4 px-4 pt-16 pb-6">
  <!-- Scoreboard -->
  <aside class="card-flat absolute top-16 right-3 left-3 max-h-44 overflow-hidden p-3 sm:right-auto sm:left-4 sm:w-64" aria-label="Scoreboard">
    <p class="mb-2 flex items-center gap-2 px-1 text-xs font-semibold tracking-wide text-slate-400 uppercase"><i data-icon="trophy" class="size-4 text-amber-300"></i>Scoreboard</p>
    <ul id="rps-scores" class="scroll-y max-h-28 space-y-1 sm:max-h-64"></ul>
  </aside>

  <!-- Waiting -->
  <section id="rps-wait" class="text-center">
    <span class="mx-auto mb-3 grid size-14 place-items-center rounded-2xl bg-white/8 text-brand-300"><i data-icon="spinner" class="size-7 animate-spin"></i></span>
    <p class="font-semibold text-white">Waiting for everyone to load...</p>
  </section>

  <!-- Pick a move -->
  <section id="rps-popup" class="card reveal w-full max-w-lg p-5 text-center sm:p-7" hidden>
    <p class="eyebrow">Round <span id="rps-round">1</span> of <span id="rps-rounds">3</span></p>
    <h2 id="rps-title" class="mt-1 text-2xl font-bold tracking-tight text-white">Choose your move</h2>
    <p class="mt-3 text-5xl font-extrabold text-white tabular-nums" id="rps-countdown" aria-live="off">7</p>
    <div class="mx-auto mt-2 mb-5 h-1.5 max-w-xs overflow-hidden rounded-full bg-white/10"><div id="rps-bar" class="h-full w-full rounded-full bg-gradient-to-r from-brand-500 to-violet-500" style="transition: width 0.15s linear"></div></div>
    <div id="rps-moves" class="grid grid-cols-3 gap-3">
      <button class="rps-move group rounded-2xl border-2 border-white/10 bg-white/5 p-3 transition hover:border-brand-400/60 hover:bg-white/10 active:scale-95" data-move="rock" aria-pressed="false">
        <img src="/images/rps-rock.png" alt="" class="mx-auto size-16 object-contain transition group-hover:scale-110 sm:size-20" width="80" height="80">
        <span class="mt-2 block text-sm font-semibold text-white">Rock</span>
      </button>
      <button class="rps-move group rounded-2xl border-2 border-white/10 bg-white/5 p-3 transition hover:border-brand-400/60 hover:bg-white/10 active:scale-95" data-move="paper" aria-pressed="false">
        <img src="/images/rps-paper.png" alt="" class="mx-auto size-16 object-contain transition group-hover:scale-110 sm:size-20" width="80" height="80">
        <span class="mt-2 block text-sm font-semibold text-white">Paper</span>
      </button>
      <button class="rps-move group rounded-2xl border-2 border-white/10 bg-white/5 p-3 transition hover:border-brand-400/60 hover:bg-white/10 active:scale-95" data-move="scissors" aria-pressed="false">
        <img src="/images/rps-scissors.png" alt="" class="mx-auto size-16 object-contain transition group-hover:scale-110 sm:size-20" width="80" height="80">
        <span class="mt-2 block text-sm font-semibold text-white">Scissors</span>
      </button>
    </div>
    <p id="rps-hint" class="mt-4 text-sm text-slate-400">No pick? A random move is chosen for you.</p>
  </section>

  <!-- Reveal -->
  <section id="rps-reveal" class="w-full max-w-2xl text-center" hidden>
    <p class="eyebrow">Round <span id="rps-reveal-round">1</span> results</p>
    <h2 id="rps-reveal-title" class="mt-1 mb-5 text-2xl font-bold tracking-tight text-white">Moves revealed</h2>
    <div id="rps-reveal-grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3"></div>
  </section>
</div>
