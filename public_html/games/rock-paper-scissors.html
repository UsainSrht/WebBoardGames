<div id="rps-root" class="scroll-y absolute inset-0 flex flex-col items-center px-3 pt-16 pb-[max(env(safe-area-inset-bottom),1rem)] sm:px-6">
  <div class="flex w-full max-w-3xl flex-1 flex-col gap-3 sm:gap-4">
    <!-- Header -->
    <header class="flex items-end justify-between gap-3 px-1 pt-2">
      <div class="min-w-0">
        <p id="rps-eyebrow" class="eyebrow" data-i18n="rock-paper-scissors.rules.title">Rock Paper Scissors</p>
        <h2 id="rps-title" class="mt-0.5 truncate text-xl font-bold tracking-tight text-white sm:text-2xl" data-i18n="rock-paper-scissors.title.waiting">Getting ready</h2>
      </div>
      <div id="rps-mode" class="chip shrink-0"></div>
    </header>

    <!-- Stage -->
    <section id="rps-stage" class="card relative flex min-h-[21rem] flex-1 flex-col items-center justify-center overflow-hidden px-3 py-5 text-center sm:min-h-[24rem] sm:px-6" aria-live="polite"></section>

    <!-- History -->
    <div id="rps-history-wrap" class="card-flat px-3 py-2" hidden>
      <p class="mb-1.5 text-[11px] font-semibold tracking-[0.14em] text-slate-400 uppercase" data-i18n="rock-paper-scissors.rounds">Rounds</p>
      <ol id="rps-history" class="scroll-y flex gap-1.5 pb-1" style="overflow-y: hidden"></ol>
    </div>

    <!-- Scoreboard -->
    <aside class="card-flat p-3" data-i18n-attr="aria-label:rock-paper-scissors.scoreboard" aria-label="Scoreboard">
      <p id="rps-board-title" class="mb-2 flex items-center gap-2 px-1 text-xs font-semibold tracking-[0.14em] text-slate-400 uppercase"></p>
      <ul id="rps-board" class="grid grid-cols-1 gap-1.5 sm:grid-cols-2"></ul>
    </aside>
  </div>
</div>
