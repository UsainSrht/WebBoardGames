<style>
  #kd-root {
    position: absolute; inset: 0; display: grid; gap: 0.5rem; overflow: hidden;
    padding: 4rem 0.5rem max(env(safe-area-inset-bottom), 0.5rem);
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "draft" "banner" "main" "players";
    --kd-ink: #0b0e1a;
  }
  #kd-draft { grid-area: draft; }
  #kd-banner { grid-area: banner; }
  #kd-main { grid-area: main; min-height: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  #kd-players { grid-area: players; min-width: 0; }
  @media (min-width: 1024px) {
    #kd-root {
      padding: 4.5rem 1rem 1rem; gap: 0.75rem 1rem;
      grid-template-columns: minmax(21rem, 27rem) minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      grid-template-areas: "draft main" "banner main" "players main";
    }
    #kd-players { overflow-y: auto; }
    #kd-players-list { flex-direction: column !important; overflow: visible !important; }
    #kd-players-list .kd-pcard { width: 100% !important; }
  }

  /* draft rows */
  .kd-row { display: grid; gap: 0.4rem; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
  .kd-slot {
    position: relative; display: block; width: 100%; aspect-ratio: 2 / 1; border-radius: 0.55rem;
    padding: 0; border: 0; background: #1d2440; cursor: default; transition: transform .15s, box-shadow .15s, opacity .25s, filter .25s;
    box-shadow: 0 2px 6px rgb(0 0 0 / .45); -webkit-tap-highlight-color: transparent;
  }
  .kd-slot img.kd-tile { width: 100%; height: 100%; display: block; border-radius: 0.55rem; object-fit: cover; }
  .kd-slot .kd-no {
    position: absolute; left: 3px; bottom: 3px; min-width: 1.25rem; padding: 0 4px; height: 1rem; border-radius: 999px;
    background: rgb(7 9 15 / .78); color: #e2e8f0; font: 700 10px/1rem ui-sans-serif, system-ui; text-align: center;
  }
  .kd-slot[data-pick="1"] { cursor: pointer; }
  .kd-slot[data-pick="1"]:hover { transform: translateY(-2px); }
  .kd-slot[data-pick="1"] { animation: kd-glow 1.6s ease-in-out infinite; }
  .kd-slot[data-sel="1"] { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 0 3px #34d399, 0 8px 18px rgb(0 0 0 / .5); animation: none; z-index: 2; }
  .kd-slot[data-active="1"] { box-shadow: 0 0 0 3px #fbbf24, 0 6px 16px rgb(0 0 0 / .5); }
  .kd-slot[data-done="placed"] { opacity: .38; filter: saturate(.5); }
  .kd-slot[data-done="discarded"] { opacity: .5; filter: grayscale(1) brightness(.7); }
  .kd-slot .kd-mark {
    position: absolute; inset: 0; display: grid; place-items: center; border-radius: 0.55rem; color: #fff; pointer-events: none;
  }
  .kd-slot[data-done="discarded"] .kd-mark { background: rgb(190 18 60 / .35); }
  @keyframes kd-glow { 0%,100% { box-shadow: 0 2px 6px rgb(0 0 0 / .45), 0 0 0 0 rgb(52 211 153 / 0); } 50% { box-shadow: 0 2px 6px rgb(0 0 0 / .45), 0 0 0 3px rgb(52 211 153 / .55); } }
  .kd-pawn {
    position: absolute; right: 3px; bottom: -6px; height: 140%; max-height: 2.4rem; aspect-ratio: 1; pointer-events: none;
    filter: drop-shadow(0 2px 2px rgb(0 0 0 / .6)); transform-origin: 50% 90%;
  }
  .kd-slot .kd-pawn { height: 1.9rem; width: 1.9rem; right: 2px; bottom: 2px; }
  @media (min-width: 640px) { .kd-slot .kd-pawn { height: 2.3rem; width: 2.3rem; } }

  /* board */
  #kd-board-wrap { position: relative; flex: 1 1 0; min-height: 0; display: grid; place-items: center; }
  .kd-grid { position: relative; border-radius: 0.75rem; user-select: none; touch-action: manipulation; }
  .kd-cells { position: absolute; inset: 0; display: grid; border-radius: 0.5rem; overflow: hidden; }
  .kd-cell { display: block; background: rgb(255 255 255 / .06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07); }
  .kd-cell.kd-off {
    background: repeating-linear-gradient(45deg, rgb(255 255 255 / .02) 0 5px, rgb(0 0 0 / .25) 5px 10px);
    box-shadow: none;
  }
  .kd-dom { position: absolute; border-radius: 0.3rem; box-shadow: 0 0 0 1px rgb(0 0 0 / .5), 0 3px 6px rgb(0 0 0 / .4); pointer-events: none; object-fit: cover; }
  .kd-castle { position: absolute; display: grid; place-items: center; border-radius: 0.3rem; background: linear-gradient(160deg, #94a3b8, #475569); pointer-events: none; box-shadow: 0 0 0 1px rgb(0 0 0 / .5), 0 3px 6px rgb(0 0 0 / .4); }
  .kd-castle img { width: 94%; height: 94%; object-fit: contain; }
  .kd-mk { position: absolute; display: grid; place-items: center; pointer-events: none; }
  .kd-mk i { width: 28%; height: 28%; border-radius: 999px; background: rgb(255 255 255 / .55); box-shadow: 0 0 0 2px rgb(52 211 153 / .45); animation: kd-pulse 1.4s ease-in-out infinite; }
  @keyframes kd-pulse { 50% { transform: scale(1.35); opacity: .6; } }
  .kd-ov { position: absolute; border-radius: 0.3rem; pointer-events: none; }
  .kd-ov.ok { background: rgb(16 185 129 / .38); box-shadow: inset 0 0 0 2px #34d399; }
  .kd-ov.bad { background: rgb(244 63 94 / .38); box-shadow: inset 0 0 0 2px #fb7185; }
  .kd-prev { opacity: .9; }

  /* tray */
  #kd-tray { min-height: 4.75rem; }
  #kd-tray-tile { touch-action: none; cursor: grab; }
  #kd-tray-tile:active { cursor: grabbing; }

  /* players */
  #kd-players-list { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .kd-pcard { flex: 0 0 auto; min-width: 8.5rem; text-align: left; transition: box-shadow .2s, background .2s; }
  .kd-pcard[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--color-brand-400, #818cf8); background: rgb(99 102 241 / .14); }
  .kd-mini { display: grid; gap: 1px; border-radius: 3px; overflow: hidden; background: rgb(0 0 0 / .35); flex: none; }
  .kd-mini b { display: block; width: 9px; height: 9px; position: relative; }
  .kd-mini b.k::after { content: ""; position: absolute; inset: 3px; border-radius: 999px; background: #fde047; box-shadow: 0 0 0 1px rgb(0 0 0 / .5); }
  .kd-mini b.k2::after { inset: 2px; }
  .kd-order { display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; }
  .kd-oc { flex: none; display: flex; align-items: center; gap: 0.25rem; border-radius: 999px; padding: 2px 8px 2px 3px; background: rgb(255 255 255 / .07); font-size: 11px; font-weight: 600; color: #cbd5e1; transition: background .2s, opacity .2s; }
  .kd-oc img { width: 20px; height: 20px; }
  .kd-oc[data-done="1"] { opacity: .4; }
  .kd-oc[data-active="1"] { background: rgb(251 191 36 / .22); color: #fde68a; box-shadow: inset 0 0 0 1px rgb(251 191 36 / .6); }
  .kd-oc .n { color: #94a3b8; font-weight: 700; }
  #kd-bar { transition: width .12s linear; }
</style>

<div id="kd-root">
  <section id="kd-draft" class="card-flat p-2" data-i18n-attr="aria-label:kingdomino.draft" aria-label="Domino draft">
    <p id="kd-prev-label" class="mb-1 flex items-center gap-1.5 text-[11px] font-semibold tracking-wide text-slate-400 uppercase"></p>
    <div id="kd-prev-row" class="kd-row"></div>
    <p id="kd-cur-label" class="mt-2 mb-1 flex items-center gap-1.5 text-[11px] font-semibold tracking-wide text-slate-400 uppercase"></p>
    <div id="kd-cur-row" class="kd-row"></div>
  </section>

  <section id="kd-banner" class="card-flat px-3 py-2" aria-live="polite">
    <div class="flex items-center gap-2.5">
      <img id="kd-banner-pawn" class="size-8 shrink-0" alt="" hidden>
      <p id="kd-banner-text" class="min-w-0 flex-1 truncate text-sm font-semibold text-white" data-i18n="kingdomino.loading">Loading...</p>
      <span id="kd-clock" class="chip tabular-nums" hidden></span>
    </div>
    <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-white/10"><div id="kd-bar" class="h-full w-0 rounded-full bg-amber-400"></div></div>
    <div id="kd-order" class="kd-order mt-2"></div>
  </section>

  <section id="kd-main">
    <div id="kd-board-wrap"><div id="kd-board" class="kd-grid" role="application" data-i18n-attr="aria-label:kingdomino.board" aria-label="Kingdom board"></div></div>
    <div id="kd-tray" class="card-flat flex items-center gap-3 px-3 py-2" hidden>
      <div id="kd-tray-tile" class="w-24 shrink-0 sm:w-28"></div>
      <p id="kd-tray-hint" class="min-w-0 flex-1 text-xs leading-snug font-medium text-slate-300"></p>
      <div class="flex shrink-0 gap-2">
        <button id="kd-rotate" class="btn btn-secondary btn-icon size-11" type="button" data-i18n-attr="aria-label:kingdomino.rotate" aria-label="Rotate tile" hidden><i data-icon="rotate" class="size-5"></i></button>
        <button id="kd-confirm" class="btn btn-primary h-11 px-4" type="button" disabled></button>
      </div>
    </div>
  </section>

  <section id="kd-players" data-i18n-attr="aria-label:kingdomino.kingdoms" aria-label="Kingdoms">
    <div id="kd-players-list"></div>
  </section>
</div>
