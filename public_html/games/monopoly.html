<style>
  #mp-root { --u: 7px; }
  .mp-board { position: relative; display: grid; grid-template-columns: 1.5fr repeat(9, 1fr) 1.5fr; grid-template-rows: 1.5fr repeat(9, 1fr) 1.5fr; gap: 0; background: #0e1a2b; border: 2px solid #2b3d5c; border-radius: 12px; overflow: hidden; }
  .mp-cell { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #e9efe6; color: #111827; border: 1px solid #1f2d44; display: flex; text-align: center; cursor: pointer; font-size: calc(var(--u) * 1.34); line-height: 1.12; }
  .mp-cell:focus-visible { outline: 3px solid #a5b4fc; outline-offset: -3px; z-index: 5; }
  .mp-cell.corner { background: #dfe8f3; }
  .mp-cell .bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 1px; flex-wrap: wrap; border: 0 solid #1f2d44; overflow: hidden; }
  .mp-cell .body { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2px 1px; }
  .mp-cell .nm { font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; hyphens: auto; }
  .mp-cell .pr { font-weight: 600; opacity: 0.75; }
  .mp-cell .own { position: absolute; width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #0008; }
  .mp-cell.mort .body, .mp-cell.mort .bar { opacity: 0.4; }
  .mp-cell.mort::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 5px, #0003 5px 7px); pointer-events: none; }
  .mp-cell.here { box-shadow: inset 0 0 0 3px #818cf8; }
  .mp-house { width: calc(var(--u) * 1.15); height: calc(var(--u) * 1.15); }
  .mp-hotel { width: calc(var(--u) * 2.2); height: calc(var(--u) * 1.3); background: #dc2626; border-radius: 2px; border: 1px solid #fff8; }
  .mp-token { position: absolute; width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); margin: calc(var(--u) * -1.8) 0 0 calc(var(--u) * -1.8); transition: left 0.14s linear, top 0.14s linear; z-index: 6; pointer-events: none; filter: drop-shadow(0 2px 2px #0008); }
  .mp-token.turn { animation: mp-bob 1s ease-in-out infinite; }
  @keyframes mp-bob { 50% { transform: translateY(-14%); } }
  .mp-center { grid-area: 2 / 2 / 11 / 11; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * 1.5); background: radial-gradient(circle at 50% 40%, #16304d, #0c1626); color: #e2e8f0; text-align: center; }
  .mp-die { transition: transform 0.1s; }
  .mp-die.roll { animation: mp-shake 0.12s linear infinite; }
  @keyframes mp-shake { 25% { transform: rotate(14deg) translateY(-3px); } 75% { transform: rotate(-14deg) translateY(2px); } }
  .mp-float { position: fixed; z-index: 70; pointer-events: none; font-weight: 800; font-size: 18px; text-shadow: 0 2px 4px #000a; }
  .mp-overlay { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 1rem; background: rgb(7 9 15 / 0.66); backdrop-filter: blur(4px); overflow-y: auto; }
  .mp-overlay[hidden] { display: none; }
  .mp-sheet-open #mp-panels { display: flex !important; position: fixed; left: 0; right: 0; bottom: 0; top: 4.25rem; z-index: 35; border-radius: 1.5rem 1.5rem 0 0; background: #0f1322; border: 1px solid #ffffff1a; padding-bottom: env(safe-area-inset-bottom); }
  .mp-prop { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.5rem; border-radius: 0.75rem; background: #ffffff0a; }
  .mp-mini { min-width: 2.25rem; height: 2.25rem; padding: 0; }
  .mp-dis { opacity: 0.4; }
  @media (min-width: 1024px) { #mp-panels { display: flex !important; } }
  @media (prefers-reduced-motion: reduce) { .mp-token, .mp-die.roll, .mp-token.turn { animation: none; transition: none; } }
</style>
<div id="mp-root" class="absolute inset-0 flex flex-col pt-16 lg:flex-row">
  <!-- Board column -->
  <div class="flex min-h-0 min-w-0 flex-1 flex-col">
    <div class="scroll-y shrink-0 px-2 pb-1" style="overflow-y: hidden">
      <ul id="mp-players" class="flex w-max min-w-full gap-1.5 lg:justify-center"></ul>
    </div>
    <div class="relative min-h-0 flex-1">
      <div id="mp-wrap" class="scroll-y absolute inset-0 grid place-items-center p-1" style="overflow: auto">
        <div id="mp-board" class="mp-board" role="grid" aria-label="Board"></div>
      </div>
      <div class="absolute right-2 bottom-2 flex flex-col gap-1.5 lg:hidden">
        <button id="mp-zin" class="btn btn-icon border border-white/20 bg-ink-700 text-white" aria-label="Zoom in" data-i18n-attr="aria-label:monopoly.ui.zoomIn"><i data-icon="plus" class="size-5"></i></button>
        <button id="mp-zout" class="btn btn-icon border border-white/20 bg-ink-700 text-white" aria-label="Zoom out" data-i18n-attr="aria-label:monopoly.ui.zoomOut"><i data-icon="minus" class="size-5"></i></button>
      </div>
    </div>
  </div>

  <!-- Side: banner, actions, panels -->
  <aside id="mp-side" class="flex shrink-0 flex-col gap-2 px-3 pt-2 pb-[max(env(safe-area-inset-bottom),0.75rem)] lg:min-h-0 lg:w-[25rem] lg:pt-0">
    <div class="card-flat p-2.5">
      <p id="mp-banner" class="text-sm font-semibold text-white" aria-live="polite"></p>
      <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-white/10"><div id="mp-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-brand-500 to-violet-500"></div></div>
      <div id="mp-actions" class="mt-2 flex flex-wrap gap-2"></div>
    </div>
    <div class="flex gap-2 lg:hidden">
      <button id="mp-sheet" class="btn btn-secondary btn-sm flex-1"><i data-icon="house" class="size-4"></i><span data-i18n="monopoly.ui.assets">Assets and log</span></button>
      <button id="mp-trade-open" class="btn btn-secondary btn-sm flex-1"><i data-icon="swap" class="size-4"></i><span data-i18n="monopoly.ui.trade">Trade</span></button>
    </div>
    <div id="mp-panels" class="hidden min-h-0 flex-1 flex-col gap-2 overflow-hidden p-3 lg:p-0">
      <div class="flex items-center gap-2">
        <div class="flex flex-1 gap-1" role="tablist">
          <button id="mp-tab-assets" class="btn btn-sm btn-secondary flex-1" role="tab" data-i18n="monopoly.ui.tabAssets">Properties</button>
          <button id="mp-tab-log" class="btn btn-sm btn-ghost flex-1" role="tab" data-i18n="monopoly.ui.tabLog">Log</button>
        </div>
        <button id="mp-trade-open2" class="btn btn-sm btn-secondary hidden lg:inline-flex"><i data-icon="swap" class="size-4"></i><span data-i18n="monopoly.ui.trade">Trade</span></button>
        <button id="mp-sheet-close" class="btn btn-ghost btn-sm lg:hidden" aria-label="Close" data-i18n-attr="aria-label:monopoly.ui.close"><i data-icon="mp-x" class="size-5"></i></button>
      </div>
      <div id="mp-assets" class="scroll-y min-h-0 flex-1 space-y-1.5"></div>
      <ol id="mp-log" class="scroll-y min-h-0 flex-1 space-y-1 text-[13px] text-slate-300" hidden></ol>
    </div>
  </aside>

  <!-- Overlays (filled by script) -->
  <div id="mp-ov-prop" class="mp-overlay" hidden></div>
  <div id="mp-ov-auction" class="mp-overlay" hidden></div>
  <div id="mp-ov-trade" class="mp-overlay" hidden></div>
  <div id="mp-ov-card" class="mp-overlay" hidden></div>
  <div id="mp-ov-confirm" class="mp-overlay" hidden></div>
</div>
