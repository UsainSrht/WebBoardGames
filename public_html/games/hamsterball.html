<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="hb-root" class="absolute inset-0 touch-none select-none" style="background: radial-gradient(circle at 50% 40%, #1a2347 0%, #0b1020 70%)">
  <canvas id="canvas" class="block size-full"></canvas>

  <!-- Scoreboard -->
  <aside class="card-flat pointer-events-none absolute top-16 left-3 w-52 p-2.5 sm:w-60" aria-label="Players">
    <p class="mb-1.5 flex items-center gap-2 px-1 text-xs font-semibold tracking-wide text-slate-400 uppercase"><i data-icon="users" class="size-4 text-brand-300"></i>Players</p>
    <ul id="playerInfo" class="max-h-40 space-y-1 overflow-hidden sm:max-h-64"></ul>
  </aside>

  <!-- Loading -->
  <div id="loadingIndicator" class="absolute inset-0 grid place-items-center">
    <div class="text-center">
      <span class="mx-auto mb-3 grid size-14 place-items-center rounded-2xl bg-white/8 text-brand-300"><i data-icon="spinner" class="size-7 animate-spin"></i></span>
      <p id="connectionStatus" class="font-semibold text-white">Waiting for everyone to load...</p>
    </div>
  </div>

  <!-- Eliminated / spectating -->
  <div id="gameStatus" class="card animate-pop absolute top-1/3 left-1/2 w-72 max-w-[90vw] -translate-x-1/2 p-5 text-center" hidden>
    <span class="mx-auto mb-2 grid size-12 place-items-center rounded-2xl bg-rose-500/15 text-rose-300"><i data-icon="heart" class="size-6"></i></span>
    <h2 id="statusTitle" class="text-xl font-bold text-white">Knocked out</h2>
    <p id="statusMessage" class="mt-1 text-sm text-slate-400">You fell off the plate. Watching the rest of the match.</p>
  </div>

  <div id="spectatorNote" class="chip chip-brand pointer-events-none absolute bottom-4 left-1/2 -translate-x-1/2" hidden><i data-icon="eye" class="size-3.5"></i>Host view: watching the match</div>

  <!-- Keyboard hint (hidden on touch devices) -->
  <aside id="controls" class="card-flat pointer-events-none absolute right-4 bottom-4 hidden p-3 text-xs text-slate-300 [@media(pointer:fine)]:block" aria-label="Controls">
    <p class="mb-1.5 flex items-center gap-2 font-semibold text-white"><i data-icon="keyboard" class="size-4 text-brand-300"></i>Controls</p>
    <p><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> or arrows to move</p>
    <p class="mt-1"><span class="kbd">Space</span> to boost</p>
    <p class="mt-2 text-slate-400">Knock rivals off the tilting plate.</p>
  </aside>

  <!-- Touch controls -->
  <div id="touchControls" class="absolute inset-x-0 bottom-0 hidden items-end justify-between p-5 pb-8 [@media(pointer:coarse)]:flex">
    <div id="joystick" class="relative size-32 rounded-full border-2 border-white/20 bg-white/8 backdrop-blur-sm" role="application" aria-label="Move joystick">
      <div id="joystickKnob" class="absolute top-1/2 left-1/2 size-14 -translate-x-1/2 -translate-y-1/2 rounded-full bg-white/40 shadow-lg"></div>
    </div>
    <button id="boostBtn" class="btn btn-secondary size-20 flex-col gap-1 rounded-full px-0 text-xs" aria-label="Boost"><i data-icon="bolt" class="size-6"></i>Boost</button>
  </div>
</div>
