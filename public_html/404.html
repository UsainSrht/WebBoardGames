<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="nf.title">Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tailwind.css">
</head>
<body class="grid min-h-dvh place-items-center px-4 safe-t safe-b">
  <main class="reveal mx-auto max-w-md text-center">
    <div class="mx-auto mb-6 grid size-20 place-items-center rounded-3xl bg-gradient-to-br from-brand-500/30 to-violet-500/25 text-brand-300 ring-1 ring-white/10 animate-float">
      <i data-icon="dice" class="size-10"></i>
    </div>
    <p class="bg-gradient-to-r from-brand-300 via-violet-400 to-pink-400 bg-clip-text text-7xl font-extrabold tracking-tight text-transparent">404</p>
    <h1 class="mt-3 text-2xl font-bold tracking-tight text-white" data-i18n="nf.headline">This page rolled off the table</h1>
    <p class="mt-2 text-slate-400" data-i18n="nf.text">The page you are looking for does not exist or has moved.</p>
    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a href="/" class="btn btn-primary btn-lg"><i data-icon="home" class="size-5"></i><span data-i18n="nf.home">Back to the games</span></a>
      <button class="btn btn-secondary btn-lg" onclick="history.length > 1 ? history.back() : location.assign('/')"><i data-icon="arrow-left" class="size-5"></i><span data-i18n="nf.back">Go back</span></button>
    </div>
    <p class="chip mt-8"><i data-icon="lightbulb" class="size-3.5 text-amber-300"></i><span data-i18n="nf.tip">Got a room code? Enter it on the home page to join.</span></p>
  </main>
  <script src="/i18n.js"></script>
  <script src="/core.js"></script>
</body>
</html>
